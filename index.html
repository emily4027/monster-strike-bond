<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>怪物彈珠羈絆場次工具</title>
    <!-- 先連線外部資源，縮短開頁時間 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- 工具組共用風格（由工具箱提供，改一處五個工具一起變） -->
    <link rel="stylesheet" href="/monster-strike-toolbox/theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="ms-page ms-has-dock">

    <div class="container main-container ms-shell">
        <header class="app-header ms-header">
            <div class="ms-header-icon" aria-hidden="true">🤝</div>
            <h1 class="ms-title">怪物彈珠羈絆場次工具</h1>

            <div id="cloudStatus" class="cloud-status ms-auth-status">
                <span class="status-dot" id="statusDot"></span>
                <span id="cloudStatusText">連線中...</span>
            </div>

            <div id="authErrorMsg" class="auth-error" style="display: none;"></div>

            <div id="auth-container" class="ms-auth">
                <button type="button" id="google-login-btn" class="auth-btn login ms-login-btn" style="display: none;">
                    <i class="bi bi-google"></i> 用 Google 登入（啟用雲端同步）
                </button>
                <div id="user-info" class="ms-user-chip" style="display: none;">
                    <img id="user-avatar" src="" alt="" class="ms-avatar">
                    <span id="user-display-name" class="fw-bold"></span>
                    <button type="button" id="logout-btn" class="ms-btn ms-btn-sm ms-btn-ghost">登出</button>
                </div>
            </div>
            <div class="today-label">今天（台灣時間）：<span id="todayLabel"></span></div>
        </header>

        <!-- 隊友名單 -->
        <section id="rosterSection" class="section-card ms-card mb-3"></section>
        <section id="playSection" class="section-card ms-card mb-3"></section>

        <!-- 帳號切換 -->
        <nav class="account-tabs" id="accountTabs" aria-label="帳號"></nav>

        <!-- 目前帳號 -->
        <main id="accountPanel"></main>

        <!-- 設定與資料管理 -->
        <section class="section-card ms-card mt-4 mb-5">
            <div class="card-header ms-card-head">
                <h2 class="ms-card-title"><i class="bi bi-gear-fill"></i> 設定與資料</h2>
            </div>
            <div class="p-2">
                <div class="row g-3 align-items-end">
                    <div class="col-sm-6 col-md-4">
                        <label for="globalStaminaPerGame" class="form-label">每場體力（預設值）</label>
                        <input type="number" inputmode="numeric" min="1" class="form-control" id="globalStaminaPerGame">
                        <div class="form-text">每段羈絆也可以個別設定。</div>
                    </div>
                    <div class="col-md-8 d-flex flex-wrap gap-2">
                        <button type="button" id="exportBtn" class="btn btn-secondary"><i class="bi bi-download"></i> 下載備份</button>
                        <button type="button" id="importBtn" class="btn btn-secondary"><i class="bi bi-folder2-open"></i> 載入備份</button>
                        <input type="file" id="importFile" accept=".json" hidden>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- 浮動列：手機在底部固定一列（不蓋內容），桌機在右下角 -->
    <nav class="ms-float" aria-label="其他工具與連結">
        <!-- 懸浮工具箱 (工具連結會改用工具箱 tools.js 的清單；讀不到時使用下面的連結) -->
        <div class="toolbox-menu-wrapper">
            <div class="toolbox-items-list">
                <a href="https://emily4027.github.io/monster-strike-toolbox/" class="toolbox-item toolbox-home">
                    <i class="bi bi-house-fill"></i> 工具箱首頁
                </a>
                <a href="https://emily4027.github.io/monster-strike-fruit-assign/" class="toolbox-item">🍏 果實分配計算機</a>
                <a href="https://emily4027.github.io/monster-strike-gacha/" class="toolbox-item">📊 抽卡統計工具</a>
                <a href="https://emily4027.github.io/monster-strike-gacha-data/" class="toolbox-item toolbox-sub">🗂️ 轉蛋資料庫</a>
                <a href="https://emily4027.github.io/monster-strike-bond/" class="toolbox-item active">🤝 羈絆場次工具 (現行)</a>
            </div>
            <button type="button" class="toolbox-main-btn" aria-haspopup="true" aria-expanded="false"><i class="bi bi-tools"></i> 工具箱</button>
        </div>

        <a href="https://github.com/emily4027/monster-strike-bond" target="_blank" rel="noopener" class="github-project-link" title="前往 GitHub 專案頁面">
            <i class="bi bi-github"></i> GitHub
        </a>
    </nav>
    <script>
        // 備援：shared.js 沒載入時自己處理工具箱開關（點按鈕開／關、點選單外或按 Esc 關閉）；
        // shared.js 已處理（外框有 data-toolbox-bound）就跳過
        window.addEventListener('load', () => {
            const wrap = document.querySelector('.ms-float .toolbox-menu-wrapper');
            const btn = wrap && wrap.querySelector('.toolbox-main-btn');
            if (!btn || wrap.hasAttribute('data-toolbox-bound')) return;
            wrap.setAttribute('data-toolbox-bound', 'fallback');
            const setOpen = (open) => { wrap.classList.toggle('is-open', open); btn.setAttribute('aria-expanded', String(open)); };
            btn.addEventListener('click', () => setOpen(!wrap.classList.contains('is-open')));
            document.addEventListener('pointerdown', (e) => { if (!wrap.contains(e.target)) setOpen(false); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });
        });
    </script>

    <!-- 訊息提示框 (可附一個動作按鈕) -->
    <div id="toast" role="status" aria-live="polite">
        <span id="toastText"></span>
        <button type="button" id="toastAction" class="btn btn-sm btn-light" hidden></button>
    </div>

    <!-- Modal：帳號 -->
    <div class="modal fade" id="accountModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content" id="accountForm" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="accountModalTitle">新增帳號</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
                </div>
                <div class="modal-body">
                    <label for="accountName" class="form-label">遊戲帳號名稱</label>
                    <input type="text" class="form-control mb-3" id="accountName" maxlength="40" required>
                    <label for="accountLevel" class="form-label">我的等級</label>
                    <input type="number" inputmode="numeric" min="1" class="form-control" id="accountLevel" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">儲存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal：從名單選隊友 -->
    <div class="modal fade" id="pickModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">從名單選隊友</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
                </div>
                <div class="modal-body">
                    <div id="pickList" class="list-group"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-primary me-auto" id="pickNewPlayer"><i class="bi bi-person-plus"></i> 名單裡沒有？新增玩家</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal：調整和某位隊友的進度 (不用拉進隊伍) -->
    <div class="modal fade" id="progressModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <form class="modal-content" id="progressForm" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="progressModalTitle">調整進度</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
                </div>
                <div class="modal-body">
                    <p class="form-text mt-0">直接填遊戲裡目前的次數。不在隊伍裡也可以改，之後選進隊伍會從這裡接續。</p>
                    <div id="progressRows" class="progress-rows"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">儲存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal：名單玩家 -->
    <div class="modal fade" id="playerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content" id="playerForm" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="playerModalTitle">新增玩家到名單</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label" for="partnerHandle">社群帳號</label>
                    <div class="input-group mb-2">
                        <select class="form-select social-select" id="partnerPlatform" aria-label="社群平台"></select>
                        <input type="text" class="form-control" id="partnerHandle" maxlength="60" placeholder="帳號名稱 / ID">
                    </div>
                    <input type="text" class="form-control mb-2" id="partnerCustomPlatform" maxlength="20" placeholder="平台名稱（例如：Threads）" hidden>
                    <div class="form-text mb-3">同一個社群帳號就是同一位玩家；他的每個遊戲帳號都和你的帳號各自羈絆。</div>

                    <div class="form-label">遊戲帳號</div>
                    <div id="memberRows" class="member-rows mb-2"></div>
                    <button type="button" class="btn btn-sm btn-outline-primary mb-3" id="addMemberRow"><i class="bi bi-plus-lg" aria-hidden="true"></i> 新增遊戲帳號</button>

                    <label for="playerNote" class="form-label">備註（選填）</label>
                    <input type="text" class="form-control" id="playerNote" maxlength="100">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">儲存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal：修改次數 -->
    <div class="modal fade" id="countsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content" id="countsForm" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="countsModalTitle">修改次數</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
                </div>
                <div class="modal-body">
                    <label for="countsCycle" class="form-label">本輪已達成次數（0–19）</label>
                    <input type="number" inputmode="numeric" min="0" max="19" class="form-control mb-3" id="countsCycle" required>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="countsToday">
                        <label class="form-check-label" for="countsToday">今天已達成</label>
                    </div>
                    <label for="countsGames" class="form-label">羈絆條目前已打幾場</label>
                    <input type="number" inputmode="numeric" min="0" class="form-control mb-3" id="countsGames" required>
                    <label for="countsLimit" class="form-label">跑滿需要幾場</label>
                    <input type="number" inputmode="numeric" min="1" class="form-control" id="countsLimit">
                    <div class="form-text mb-3" id="countsLimitHint"></div>
                    <label for="countsSpg" class="form-label">每場體力（這段羈絆）</label>
                    <input type="number" inputmode="numeric" min="1" class="form-control" id="countsSpg">
                    <div class="form-text">留空 = 用設定裡的預設值。</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">儲存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Firebase 初始化改由工具箱共用檔提供（app、auth 與其他工具共用同一份設定）
        import { app, auth } from '/monster-strike-toolbox/shared/firebase.js';
        import { GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, runTransaction } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebaseAuth = auth;
        window.db = getFirestore(app);
        window.envAppId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        Object.assign(window, { GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, doc, getDoc, runTransaction });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="/monster-strike-toolbox/shared/shared.js"></script>
    <script src="bond.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
